services:
  - type: web
    name: talentbridge
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run db:generate
    startCommand: npx prisma db push --schema=server/prisma/schema.prisma --skip-generate && npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: talentbridge-db
          property: connectionString

databases:
  - name: talentbridge-db
    plan: free